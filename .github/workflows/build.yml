
name: Build CleanYourTV Launcher

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Checkout CleanYourTV source
        uses: actions/checkout@v4
        with:
          repository: Gathin23/cleanyourtv
          path: source

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Build launcher APK
        working-directory: source/launcher
        run: ./gradlew assembleRelease --no-daemon

      - name: Find generated APK
        run: find source -type f -name "*.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cleanyourtv-launcher
          path: source/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
